# 情景判断题库（SJT · Situational Judgment Test）
# 形式：具体 AI 使用场景 + 4 个行为选项，每个选项挂维度投票（行为选择反推特质）。
# 依据：SJT 效度证据优于自我报告（McDaniel et al. 2001 元分析；Christian et al. 2010）。
# 用法：confirm 随机抽题；votes 的维度代码对应 BFAS（O1/O2/C1/C2/E1/E2/A2/N1/N2）。
# schema_version: 1

scenarios:

  - id: bug-reproduce
    scene: "深夜的 bug 终于复现了。你转身对 AI 说的第一句话是："
    options:
      - text: "复现了！看这个调用栈，我怀疑是 X，帮我验证"
        votes: { E1: "+", E2: "+", O1: "+" }
      - text: "先别动，把相关配置全部查一遍，我要排除环境因素"
        votes: { C2: "+", N2: "+" }
      - text: "和上个月那个类似问题对比一下，我想找规律"
        votes: { O1: "+", C1: "+" }
      - text: "直接给我三种修法，今晚必须收掉"
        votes: { E2: "+", C1: "+" }

  - id: ai-wrong-answer
    scene: "AI 给的方案你隐约觉得不对，但又说不上来哪里不对。你会："
    options:
      - text: "让它逐步解释推理过程，每一步我都要看依据"
        votes: { O1: "+", C2: "+" }
      - text: "先照着试，跑挂了再回来问它"
        votes: { E2: "+" }
      - text: "换两个模型/换个问法交叉验证一下"
        votes: { O1: "+", C1: "+" }
      - text: "算了，大概率是我自己想多了，按它说的来"
        votes: { A2: "+", N2: "-" }

  - id: new-tool
    scene: "同事推荐了个新 agent 工具，听说很强但文档很少。你的第一反应："
    options:
      - text: "立刻装来试，文档边用边看"
        votes: { O2: "+", E2: "+" }
      - text: "让 AI 先帮我调研它的口碑、源码结构和替代品，出个对比报告再决定"
        votes: { O1: "+", C2: "+" }
      - text: "观望，等它出稳定版、社区踩完坑再说"
        votes: { N2: "+", O2: "-" }
      - text: "找个周末专门搭环境认真评估一整天"
        votes: { C1: "+", O2: "+" }

  - id: big-task
    scene: "接到一个两周的大任务，需求刚拿到手。你打开 AI 的第一个指令是："
    options:
      - text: "帮我拆解成阶段和里程碑，先列个完整计划"
        votes: { C2: "+" }
      - text: "最难的部分现在就开始，先趟一遍雷"
        votes: { E2: "+", C1: "+" }
      - text: "先研究同类方案都怎么做的，看三个参考再动手"
        votes: { O1: "+", C2: "+" }
      - text: "边做边规划，计划赶不上变化"
        votes: { E2: "+", C2: "-" }

  - id: weekend-idea
    scene: "周五晚上，你突然想到一个和工作无关但很有意思的点子。你会："
    options:
      - text: "现在就打开 AI 聊到把它聊透，管它几点"
        votes: { O2: "+", E1: "+" }
      - text: "记到备忘录，周一有空再说"
        votes: { C2: "+" }
      - text: "让 AI 帮我快速判断这想法值不值得投入周末时间"
        votes: { O1: "+", C6: "+" }
      - text: "和朋友分享讨论，看看大家觉得怎么样"
        votes: { E1: "+" }

  - id: ai-lifeline
    scene: "AI 帮你搞定了一件卡了很久的大事。你的反应更像："
    options:
      - text: "牛！忍不住跟同事炫耀这事是这么解的"
        votes: { E1: "+" }
      - text: "先自己把它的解法完整验证一遍再用"
        votes: { C1: "+", C2: "+" }
      - text: "马上问它能不能把这个方法沉淀成脚本，下次自动化"
        votes: { C1: "+", O1: "+" }
      - text: "继续下一件事了，搞定就搞定"
        votes: { E2: "+" }

  - id: challenged
    scene: "方案评审会上，同事当众质疑你的思路有明显漏洞。你会："
    options:
      - text: "当场承认有道理的地方，会后拉他细聊怎么改"
        votes: { A2: "+", E2: "+" }
      - text: "立刻逐条反驳，我的方案我清楚每个细节"
        votes: { E2: "+", N1: "+" }
      - text: "先让 AI 帮我压力测试一遍自己的方案，看漏洞是不是真的"
        votes: { O1: "+", C2: "+" }
      - text: "表面平静接受，回去自己反刍半天哪里没做好"
        votes: { N2: "+", N1: "+" }

  - id: learn-new
    scene: "要进入一个完全陌生的技术领域（比如下周要接手新模块）。你的打开方式："
    options:
      - text: "让 AI 出一份从原理到架构的学习路线，按部就班啃"
        votes: { O1: "+", C2: "+" }
      - text: "直接上手感最核心的部分，遇到不懂的再问"
        votes: { E2: "+", O2: "+" }
      - text: "先广撒网看十个相关话题，找它们之间的联系"
        votes: { O2: "+", O1: "+" }
      - text: "找这个领域的专家同事/AI 问'新手最容易踩的五个坑'"
        votes: { O1: "+", A2: "+" }
