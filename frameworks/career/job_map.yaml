# 职业域框架 · 职业 RIASEC 代码映射表（初始版 v1）
# 说明: 每个职业的标准霍兰德代码（前三字母）。初始版覆盖技术/AI 生态常见职业，
#       后续可按用户行业扩展（O*NET 全量 900+ 职业数据可离线导入，Roadmap）。
# 来源: O*NET 25.0 Interest Codes (public domain) + Holland 常模资料整理
# schema_version: 1

# 匹配算法：用户霍兰德代码 U（如 IRC）× 职业代码 J（如 IRC）
# 一致性 = 按位比较的加权命中数（首字母命中权重 3，次位 2，末位 1，含乱序减半）

